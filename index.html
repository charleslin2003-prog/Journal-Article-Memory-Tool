ackground:#ece8e0;padding:3px;border-radius:6px;align-self:flex-start\">\n        <sc-for list=\"{{ addTabs }}\" as=\"at\" hint-placeholder-count=\"2\"><button sc-camel-on-click=\"{{ at.onClick }}\" aria-pressed=\"{{ at.pressed }}\" style=\"border:0;padding:5px 14px;border-radius:4px;font-size:12px;background:{{ at.bg }}\">{{ at.label }}<\u002Fbutton><\u002Fsc-for>\n      <\u002Fdiv>\n      <sc-if value=\"{{ addPdf }}\" hint-placeholder-val=\"{{ true }}\">\n        <label style=\"position:relative;border:1px dashed #bdb6a9;border-radius:8px;padding:28px;display:flex;flex-direction:column;align-items:center;gap:6px;background:#fff\" style-hover=\"border-color:#1d1b18\">\n          <span style=\"font-size:14px;font-weight:500\">{{ pdfLabel }}<\u002Fspan>\n          <span style=\"font-size:12px;color:#625d55\">{{ pdfStatus }}<\u002Fspan>\n          <input class=\"ly-file ly-autofocus\" type=\"file\" accept=\"application/pdf,.pdf\" sc-camel-on-change=\"{{ onFile }}\" aria-label=\"選擇 PDF 檔\">\n        <\u002Flabel>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ addDrive }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:column;gap:8px;border:1px solid #e2ddd3;border-radius:8px;padding:12px;background:#fff\">\n          <div style=\"display:flex;gap:8px\">\n            <input value=\"{{ driveQ }}\" sc-camel-on-change=\"{{ onDriveQ }}\" sc-camel-on-key-down=\"{{ onDriveKey }}\" placeholder=\"搜尋 Google 雲端硬碟裡的 PDF（留空列出最近的）\" style=\"flex:1;min-width:0;padding:9px 11px;border:1px solid #e2ddd3;border-radius:6px;background:#fff;font-size:13px;outline:none\">\n            <button sc-camel-on-click=\"{{ driveSearch }}\" style=\"border:0;padding:7px 14px;border-radius:5px;background:#1d1b18;color:#faf9f6;font-size:12px\">搜尋<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"font-size:12px;color:#625d55;line-height:1.6\">{{ driveMsg }}<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:2px;max-height:240px;overflow:auto\">\n            <sc-for list=\"{{ driveFiles }}\" as=\"df\" hint-placeholder-count=\"0\">\n              <button sc-camel-on-click=\"{{ df.onClick }}\" style=\"text-align:left;border:0;border-radius:5px;padding:8px 10px;background:{{ df.bg }};display:flex;justify-content:space-between;gap:10px\" style-hover=\"background:#f4f2ed\"><span style=\"font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ df.name }}<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#625d55;flex-shrink:0\">{{ df.meta }}<\u002Fspan><\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-size:12px;color:oklch(0.42 0.1 200)\">{{ pdfStatus }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ addText }}\" hint-placeholder-val=\"{{ false }}\">\n        <textarea value=\"{{ form.text }}\" sc-camel-on-change=\"{{ onF.text }}\" rows=\"9\" placeholder=\"貼上摘要或段落（任何語言，以空行分段）…\" style=\"padding:11px;border:1px solid #e2ddd3;border-radius:6px;background:#fff;font-family:'Noto Serif TC',Georgia,serif;font-size:13px;line-height:1.7;resize:vertical;outline:none\"><\u002Ftextarea>\n      <\u002Fsc-if>\n      <div style=\"font-size:12px;color:#625d55;line-height:1.6\">{{ addHint }}<\u002Fdiv>\n      <input value=\"{{ form.title }}\" sc-camel-on-change=\"{{ onF.title }}\" placeholder=\"標題\" style=\"padding:9px 11px;border:1px solid #e2ddd3;border-radius:6px;background:#fff;font-size:14px;outline:none\">\n      <div class=\"ly-form4\" style=\"display:grid;grid-template-columns:1.6fr 1.3fr 0.7fr 1fr;gap:8px\">\n        <input value=\"{{ form.authors }}\" sc-camel-on-change=\"{{ onF.authors }}\" placeholder=\"作者\" style=\"padding:9px 11px;border:1px solid #e2ddd3;border-radius:6px;background:#fff;font-size:13px;outline:none;min-width:0\">\n        <input value=\"{{ form.journal }}\" sc-camel-on-change=\"{{ onF.journal }}\" placeholder=\"期刊 / 會議\" style=\"padding:9px 11px;border:1px solid #e2ddd3;border-radius:6px;background:#fff;font-size:13px;outline:none;min-width:0\">\n        <input value=\"{{ form.year }}\" sc-camel-on-change=\"{{ onF.year }}\" placeholder=\"年份\" style=\"padding:9px 11px;border:1px solid #e2ddd3;border-radius:6px;background:#fff;font-size:13px;outline:none;min-width:0\">\n        <input value=\"{{ form.folder }}\" sc-camel-on-change=\"{{ onF.folder }}\" list=\"lunyi-projects\" placeholder=\"專案\" aria-label=\"專案\" style=\"padding:9px 11px;border:1px solid #e2ddd3;border-radius:6px;background:#fff;font-size:13px;outline:none;min-width:0\">\n        <datalist id=\"lunyi-projects\"><sc-for list=\"{{ folderNames }}\" as=\"fn\" hint-placeholder-count=\"0\"><option value=\"{{ fn }}\"><\u002Foption><\u002Fsc-for><\u002Fdatalist>\n      <\u002Fdiv>\n      <input value=\"{{ form.keywords }}\" sc-camel-on-change=\"{{ onF.keywords }}\" aria-label=\"關鍵詞（選填）\" placeholder=\"關鍵詞（選填，用逗號分開；有連結 AI 時可留空自動產生）\" style=\"padding:9px 11px;border:1px solid #e2ddd3;border-radius:6px;background:#fff;font-size:13px;outline:none;min-width:0\">\n      <div style=\"display:flex;justify-content:flex-end;align-items:center;gap:12px\">\n        <span style=\"font-size:12px;color:oklch(0.42 0.1 200)\">{{ importStatus }}<\u002Fspan>\n        <button sc-camel-on-click=\"{{ addPaper }}\" style=\"border:0;padding:9px 18px;border-radius:6px;background:#1d1b18;color:#faf9f6;font-size:13px;font-weight:500\">儲存並翻譯<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ orgOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;inset:0;background:rgba(29,27,24,0.35);display:grid;place-items:center;z-index:46\">\n    <div id=\"lunyi-org\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"lunyi-org-title\" aria-describedby=\"lunyi-org-desc\" style=\"width:780px;max-width:calc(100vw - 32px);max-height:calc(100vh - 48px);display:flex;flex-direction:column;background:#faf9f6;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,0.18)\">\n      <div style=\"padding:22px 26px 10px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px\">\n        <div><h2 id=\"lunyi-org-title\" class=\"ly-autofocus\" tabindex=\"-1\" style=\"margin:0;font-family:'Noto Serif TC',serif;font-size:20px;font-weight:600;outline:none\">AI 整理書目資訊<\u002Fh2><div id=\"lunyi-org-desc\" style=\"font-size:12.5px;color:#625d55;margin-top:6px;line-height:1.6\">只根據每篇論文的原文開頭擷取，找不到的欄位會留空。AI 給的值在原文裡找得到才預設勾選；找不到的會標出來、預設不勾。已經有值的欄位預設不覆蓋，按「寫入」才會改論文。<\u002Fdiv><\u002Fdiv>\n        <button sc-camel-on-click=\"{{ orgHead }}\" style=\"border:0;background:none;font-size:13px;color:#625d55;white-space:nowrap\">{{ orgCloseLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n      <div role=\"status\" aria-live=\"polite\" style=\"padding:0 26px 8px;font-size:13px;color:oklch(0.42 0.1 200)\">{{ orgStatus }}<\u002Fdiv>\n      <div style=\"overflow:auto;padding:4px 26px 16px;display:flex;flex-direction:column;gap:12px;min-height:0\">\n        <sc-for list=\"{{ orgList }}\" as=\"og\" hint-placeholder-count=\"0\">\n          <div class=\"ly-orgcard\" role=\"group\" aria-label=\"{{ og.title }}\" style=\"background:#fff;border:1px solid #e2ddd3;border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px\">\n            <div style=\"display:flex;justify-content:space-between;gap:10px;align-items:baseline\"><span style=\"font-family:'Noto Serif TC',serif;font-size:14px;font-weight:600;min-width:0;overflow-wrap:anywhere\">{{ og.title }}<\u002Fspan><span style=\"font-size:12px;color:{{ og.stColor }};white-space:nowrap\">{{ og.stLabel }}<\u002Fspan><\u002Fdiv>\n            <sc-if value=\"{{ og.isErr }}\" hint-placeholder-val=\"{{ false }}\"><div role=\"alert\" style=\"font-size:12px;line-height:1.5;color:#7a2e12;overflow-wrap:anywhere\">{{ og.errMsg }}<\u002Fdiv><\u002Fsc-if>\n            <sc-for list=\"{{ og.fields }}\" as=\"fd\" hint-placeholder-count=\"0\">\n              <label style=\"display:grid;grid-template-columns:20px 56px minmax(0,1fr);gap:8px;align-items:start;font-size:12.5px;line-height:1.5;cursor:pointer\">\n                <input type=\"checkbox\" checked=\"{{ fd.on }}\" sc-camel-on-change=\"{{ fd.onToggle }}\" aria-label=\"{{ fd.aria }}\" style=\"margin-top:3px\">\n                <span style=\"color:#625d55\">{{ fd.label }}<\u002Fspan>\n                <span style=\"min-width:0;overflow-wrap:anywhere\"><span style=\"display:block;color:#1d1b18\">{{ fd.ai }}<\u002Fspan><sc-if value=\"{{ fd.unverified }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"display:block;color:#7a2e12\">原文裡沒找到這個值，可能不正確，請自己確認<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ fd.hasCur }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"display:block;color:#625d55\">目前：{{ fd.cur }}<\u002Fspan><\u002Fsc-if><\u002Fspan>\n              <\u002Flabel>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"padding:12px 26px 20px;border-top:1px solid #e2ddd3;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap\">\n        <span style=\"font-size:12px;color:#625d55\">{{ orgCount }}<\u002Fspan>\n        <div style=\"display:flex;gap:8px\"><button sc-camel-on-click=\"{{ closeOrg }}\" style=\"border:1px solid #d6d0c4;background:#fff;border-radius:6px;padding:7px 14px;font-size:12.5px\">取消<\u002Fbutton><button sc-camel-on-click=\"{{ applyOrg }}\" aria-disabled=\"{{ orgCantApply }}\" style=\"border:0;background:#1d1b18;color:#faf9f6;border-radius:6px;padding:7px 14px;font-size:12.5px;opacity:{{ orgApplyOp }}\">{{ orgApplyLabel }}<\u002Fbutton><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ showSet }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;inset:0;background:rgba(29,27,24,0.35);display:grid;place-items:center;z-index:50\">\n    <div class=\"ly-setbox\" role=\"dialog\" aria-modal=\"true\" aria-label=\"設定與備份\" style=\"width:880px;max-width:calc(100vw - 32px);height:min(680px,calc(100vh - 40px));background:#faf9f6;border-radius:12px;box-shadow:0 24px 70px rgba(0,0,0,0.22);display:grid;grid-template-columns:200px minmax(0,1fr);overflow:hidden\">\n      <nav class=\"ly-setnav\" aria-label=\"設定分類\" style=\"background:#f1eee8;border-right:1px solid #e2ddd3;padding:14px 8px;display:flex;flex-direction:column;gap:1px\">\n        <div class=\"ly-setlabel\" style=\"padding:2px 8px 10px;font-size:12px;font-weight:600;color:#625d55\">設定<\u002Fdiv>\n        <sc-for list=\"{{ setTabs }}\" as=\"st\" hint-placeholder-count=\"4\"><button class=\"ly-sbrow\" sc-camel-on-click=\"{{ st.onClick }}\" aria-current=\"{{ st.current }}\" style=\"background:{{ st.bg }};font-weight:{{ st.weight }};white-space:nowrap\"><span aria-hidden=\"true\" style=\"width:18px;text-align:center;color:#625d55\">{{ st.icon }}<\u002Fspan>{{ st.label }}<\u002Fbutton><\u002Fsc-for>\n      <\u002Fnav>\n      <div style=\"position:relative;overflow:auto;padding:24px 30px 30px;display:flex;flex-direction:column;gap:14px;min-width:0\">\n        <button class=\"ly-setclose\" sc-camel-on-click=\"{{ closeSettings }}\" aria-label=\"關閉設定\" style=\"position:absolute;top:12px;right:14px;border:0;background:transparent;border-radius:5px;width:30px;height:30px;font-size:16px;color:#625d55\" style-hover=\"background:#ece8e0\">✕<\u002Fbutton>\n\n        <sc-if value=\"{{ setAccount }}\" hint-placeholder-val=\"{{ true }}\">\n          <h2 style=\"margin:0;font-size:20px;font-weight:600\">我的帳號<\u002Fh2>\n          <div style=\"display:flex;align-items:center;gap:14px;padding:14px;background:#fff;border:1px solid #e2ddd3;border-radius:10px\">\n            <span style=\"width:48px;height:48px;border-radius:10px;background:{{ av.bg }};color:#fff;display:grid;place-items:center;font-size:20px;font-weight:600;flex-shrink:0;overflow:hidden;position:relative\">{{ av.initial }}<span aria-hidden=\"true\" style=\"position:absolute;inset:0;background:{{ av.imgBg }}\"><\u002Fspan><\u002Fspan>\n            <div style=\"min-width:0;display:flex;flex-direction:column;gap:3px\"><span style=\"font-size:16px;font-weight:600\">{{ av.name }}<\u002Fspan><span style=\"font-size:12px;color:#625d55;line-height:1.6;white-space:pre-line\">{{ av.detail }}<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:12px;color:#625d55;line-height:1.7\">論憶沒有自己的帳號系統，登入用的是你自己的 Google 帳號：論文資料存在這台電腦的瀏覽器；登入 Google 後可以同步到你自己的雲端硬碟。<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:10px;padding:14px;background:#fff;border:1px solid #e2ddd3;border-radius:10px\">\n            <div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap\">\n              <div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font-size:14px;font-weight:600\">Google 帳號<\u002Fspan><span style=\"font-size:12px;color:#625d55\">{{ gStatus }}<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:8px\">\n                <button sc-camel-on-click=\"{{ gSignIn }}\" aria-disabled=\"{{ gOff }}\" style=\"border:0;padding:7px 14px;border-radius:6px;background:#1d1b18;color:#faf9f6;font-size:12px;opacity:{{ gOpacity }}\">{{ gSignInLabel }}<\u002Fbutton>\n                <sc-if value=\"{{ gSigned }}\" hint-placeholder-val=\"{{ false }}\"><button sc-camel-on-click=\"{{ gSignOut }}\" style=\"border:1px solid #d6d0c4;padding:7px 14px;border-radius:6px;background:#fff;font-size:12px\">登出<\u002Fbutton><\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:12px;color:#625d55;line-height:1.6\">用途：同步文獻庫到雲端硬碟、從雲端硬碟匯入 PDF、匯出 Google 文件、排入 Google 日曆。<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ setAi }}\" hint-placeholder-val=\"{{ false }}\">\n          <h2 style=\"margin:0;font-size:20px;font-weight:600\">AI 模型<\u002Fh2>\n          <div style=\"font-size:12px;line-height:1.6;color:#2c2925;background:oklch(0.95 0.025 200);padding:8px 10px;border-radius:6px\">目前：{{ aiMode }}<\u002Fdiv>\n          <div style=\"font-size:14px;font-weight:600;margin-top:4px\">翻譯<\u002Fdiv>\n          <div role=\"radiogroup\" aria-label=\"翻譯方式\" style=\"display:flex;flex-direction:column;gap:6px\">\n            <sc-for list=\"{{ trOpts }}\" as=\"to\" hint-placeholder-count=\"3\"><label style=\"border:1px solid {{ to.line }};background:{{ to.bg }};border-radius:8px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start\"><input type=\"radio\" name=\"lunyi-tr\" checked=\"{{ to.on }}\" sc-camel-on-change=\"{{ to.onClick }}\" style=\"margin:3px 0 0;accent-color:#1d1b18;flex-shrink:0\"><span style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font-size:14px;font-weight:500\">{{ to.label }}<\u002Fspan><span style=\"font-size:12px;color:#625d55;line-height:1.5\">{{ to.desc }}<\u002Fspan><\u002Fspan><\u002Flabel><\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n            <span style=\"font-size:12px;color:#625d55\">內建翻譯：{{ builtinStatus }}<\u002Fspan>\n            <sc-if value=\"{{ builtinCanEnable }}\" hint-placeholder-val=\"{{ false }}\"><button sc-camel-on-click=\"{{ enableBuiltin }}\" style=\"border:1px solid #d6d0c4;padding:6px 12px;border-radius:6px;background:#fff;font-size:12px\">啟用離線翻譯<\u002Fbutton><\u002Fsc-if>\n          <\u002Fdiv>\n          <div style=\"font-size:14px;font-weight:600;margin-top:10px\">問答與自動辨識（雲端 AI）<\u002Fdiv>\n          <div style=\"font-size:12px;color:#625d55;line-height:1.7\">AI 問答、自動辨識論文資訊與 AI 翻譯，需要你自己的 Google Gemini 或 Anthropic Claude API 金鑰。到 <button sc-camel-on-click=\"{{ goAdv }}\" style=\"border:0;background:none;padding:0;color:oklch(0.42 0.1 200);text-decoration:underline;font-size:12px\">進階<\u002Fbutton> 貼上金鑰即可；論文內容只會送到你選的那一家，費用算在金鑰所屬的帳號。<\u002Fdiv>\n          <sc-if value=\"{{ noAiOpts }}\" hint-placeholder-val=\"{{ true }}\"><button sc-camel-on-click=\"{{ goAdv }}\" style=\"align-self:flex-start;border:0;padding:7px 14px;border-radius:6px;background:#1d1b18;color:#faf9f6;font-size:12px\">設定 API 金鑰<\u002Fbutton><\u002Fsc-if>\n          <sc-if value=\"{{ hasAiOpts }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size:12px;color:#625d55\">使用中的 AI（可切換）：<\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n              <sc-for list=\"{{ aiOpts }}\" as=\"ao\" hint-placeholder-count=\"2\"><button sc-camel-on-click=\"{{ ao.onClick }}\" aria-pressed=\"{{ ao.pressed }}\" style=\"border:1px solid {{ ao.line }};background:{{ ao.bg }};color:{{ ao.color }};border-radius:6px;padding:6px 12px;font-size:12px\">{{ ao.label }}<\u002Fbutton><\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ setSync }}\" hint-placeholder-val=\"{{ false }}\">\n          <h2 style=\"margin:0;font-size:20px;font-weight:600\">同步與備份<\u002Fh2>\n          <div style=\"font-size:14px;font-weight:600\">文獻庫備份<\u002Fdiv>\n          <div style=\"font-size:12px;color:#625d55;line-height:1.6\">匯出全部論文、筆記、串聯、專案與對話成 JSON 檔，可在其他電腦匯入。匯入時會合併，同一篇論文以匯入檔為準。API 金鑰與登入資訊不會被匯出。<\u002Fdiv>\n          <div style=\"display:flex;gap:8px;align-items:center;flex-wrap:wrap\">\n            <button sc-camel-on-click=\"{{ exportJson }}\" style=\"border:0;padding:7px 14px;border-radius:6px;background:#1d1b18;color:#faf9f6;font-size:12px\">匯出 JSON<\u002Fbutton>\n            <label style=\"position:relative;border:1px solid #d6d0c4;padding:6px 14px;border-radius:6px;background:#fff;font-size:12px\">匯入 JSON<input class=\"ly-file\" type=\"file\" accept=\"application/json,.json\" sc-camel-on-change=\"{{ onImport }}\"><\u002Flabel>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#625d55\">{{ stats }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid #e2ddd3;padding-top:14px;font-size:14px;font-weight:600\">雲端同步<\u002Fdiv>\n          <div style=\"display:flex;gap:2px;background:#ece8e0;padding:3px;border-radius:6px;align-self:flex-start\">\n            <sc-for list=\"{{ syncBtns }}\" as=\"sb\" hint-placeholder-count=\"2\"><button sc-camel-on-click=\"{{ sb.onClick }}\" aria-pressed=\"{{ sb.pressed }}\" style=\"border:0;padding:5px 14px;border-radius:4px;font-size:12px;background:{{ sb.bg }}\">{{ sb.label }}<\u002Fbutton><\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-if value=\"{{ syncDrive }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"font-size:12px;color:#625d55;line-height:1.6\">文獻庫存在你雲端硬碟的「論憶」資料夾（lunyi-library.json）。其他電腦用同一個 Google 帳號登入即可同步。需要先在「我的帳號」用 Google 登入。<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ syncGist }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size:12px;color:#625d55;line-height:1.6\">把文獻庫存在你 GitHub 帳號的私人 Gist，多台電腦填同一組權杖與 Gist ID 即可同步。權杖到 GitHub → Settings → Developer settings → Personal access tokens 建立，只需要 Gists 讀寫權限。第一次上傳會自動建立 Gist。<\u002Fdiv>\n            <input type=\"password\" value=\"{{ tokenDraft }}\" sc-camel-on-change=\"{{ onTokenDraft }}\" placeholder=\"GitHub 權杖（github_pat_… 或 ghp_…），只存在這台瀏覽器\" style=\"padding:9px 11px;border:1px solid #e2ddd3;border-radius:6px;background:#fff;font-size:13px;outline:none\">\n            <input value=\"{{ gistDraft }}\" sc-camel-on-change=\"{{ onGistDraft }}\" placeholder=\"Gist ID（留空，第一次上傳時自動建立）\" style=\"padding:9px 11px;border:1px solid #e2ddd3;border-radius:6px;background:#fff;font-size:13px;outline:none\">\n            <button sc-camel-on-click=\"{{ saveSync }}\" style=\"align-self:flex-start;border:0;padding:7px 14px;border-radius:6px;background:#1d1b18;color:#faf9f6;font-size:12px\">儲存 Gist 設定<\u002Fbutton>\n          <\u002Fsc-if>\n          <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center\">\n            <button sc-camel-on-click=\"{{ pushCloud }}\" style=\"border:1px solid #d6d0c4;padding:7px 14px;border-radius:6px;background:#fff;font-size:12px\">上傳到雲端<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ pullCloud }}\" style=\"border:1px solid #d6d0c4;padding:7px 14px;border-radius:6px;background:#fff;font-size:12px\">從雲端下載並合併<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ toggleAuto }}\" style=\"border:1px solid {{ autoLine }};padding:7px 14px;border-radius:6px;background:{{ autoBg }};color:{{ autoColor }};font-size:12px\">{{ autoLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"font-size:12px;color:#625d55;line-height:1.6\">自動同步開啟時，開啟網站會先下載合併，之後每次變更約 3 秒後自動上傳。{{ syncStatus }}<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ setAdv }}\" hint-placeholder-val=\"{{ false }}\">\n          <h2 style=\"margin:0;font-size:20px;font-weight:600\">進階<\u002Fh2>\n          <div style=\"font-size:12px;color:#625d55;line-height:1.7\">直接使用你自己的 API 金鑰，費用算在金鑰所屬的帳號。金鑰只存在這台瀏覽器，不會被匯出或同步。<\u002Fdiv>\n          <label style=\"display:flex;align-items:center;gap:8px;font-size:12px;color:#2c2925\"><input type=\"checkbox\" checked=\"{{ remember }}\" sc-camel-on-change=\"{{ onRemember }}\"> 在這台電腦記住金鑰（取消勾選的話，關閉這個分頁或瀏覽器就要重新貼上；不影響 Google 登入與同步權杖）<\u002Flabel>\n          <div style=\"display:flex;flex-direction:column;gap:8px;padding:14px;background:#fff;border:1px solid #e2ddd3;border-radius:10px\">\n            <div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap\"><span style=\"font-size:14px;font-weight:600\">Google Gemini 金鑰<\u002Fspan><button sc-camel-on-click=\"{{ openAiStudio }}\" style=\"border:1px solid #d6d0c4;padding:6px 12px;border-radius:6px;background:#fff;font-size:12px\">用 Google 帳號免費取得金鑰 ↗<\u002Fbutton><\u002Fdiv>\n            <div style=\"font-size:12px;color:#625d55;line-height:1.6\">在 Google AI Studio 按「Create API key」，複製後貼回這裡。免費層的內容可能被 Google 用來改進產品，處理未發表的稿件時請留意。<\u002Fdiv>\n            <input type=\"password\" value=\"{{ gemKeyDraft }}\" sc-camel-on-change=\"{{ onGemKeyDraft }}\" placeholder=\"Gemini API 金鑰\" aria-label=\"Gemini API 金鑰\" style=\"padding:9px 11px;border:1px solid #e2ddd3;border-radius:6px;background:#fff;font-size:13px;outline:none\">\n            <input value=\"{{ gemModelDraft }}\" sc-camel-on-change=\"{{ onGemModelDraft }}\" placeholder=\"模型名稱（預設 gemini-3.8-flash）\" aria-label=\"Gemini 模型名稱\" style=\"padding:9px 11px;border:1px solid #e2ddd3;border-radius:6px;background:#fff;font-size:13px;outline:none\">\n            <div style=\"display:flex;gap:8px;align-items:center;flex-wrap:wrap\"><button sc-camel-on-click=\"{{ saveGem }}\" style=\"border:0;padding:7px 14px;border-radius:6px;background:#1d1b18;color:#faf9f6;font-size:12px\">儲存並使用 Gemini<\u002Fbutton><button sc-camel-on-click=\"{{ clearGem }}\" style=\"border:1px solid #d6d0c4;padding:7px 14px;border-radius:6px;background:#fff;font-size:12px\">清除<\u002Fbutton><span style=\"font-size:12px;color:#625d55\">{{ gemMsg }}<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px;padding:14px;background:#fff;border:1px solid #e2ddd3;border-radius:10px\">\n            <div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap\"><span style=\"font-size:14px;font-weight:600\">Anthropic Claude 金鑰<\u002Fspan><button sc-camel-on-click=\"{{ openClaudeConsole }}\" style=\"border:1px solid #d6d0c4;padding:6px 12px;border-radius:6px;background:#fff;font-size:12px\">建立 Claude 金鑰 ↗<\u002Fbutton><\u002Fdiv>\n            <div style=\"font-size:12px;color:#625d55;line-height:1.6\">在 Claude Console 建立 sk-ant- 開頭的金鑰。Claude.ai 的訂閱帳號不能用來登入第三方網站，必須使用 API 金鑰。<\u002Fdiv>\n            <input type=\"password\" value=\"{{ keyDraft }}\" sc-camel-on-change=\"{{ onKeyDraft }}\" placeholder=\"Anthropic API 金鑰（sk-ant-…）\" aria-label=\"Anthropic API 金鑰\" style=\"padding:9px 11px;border:1px solid #e2ddd3;border-radius:6px;background:#fff;font-size:13px;outline:none\">\n            <input value=\"{{ claudeModelDraft }}\" sc-camel-on-change=\"{{ onClaudeModelDraft }}\" placeholder=\"模型名稱（預設 claude-sonnet-5-5）\" aria-label=\"Claude 模型名稱\" style=\"padding:9px 11px;border:1px solid #e2ddd3;border-radius:6px;background:#fff;font-size:13px;outline:none\">\n            <input value=\"{{ codeDraft }}\" sc-camel-on-change=\"{{ onCodeDraft }}\" placeholder=\"網站存取碼（只有部署在 Vercel 且設定了存取碼時才需要）\" aria-label=\"網站存取碼\" style=\"padding:9px 11px;border:1px solid #e2ddd3;border-radius:6px;background:#fff;font-size:13px;outline:none\">\n            <div style=\"display:flex;gap:8px;align-items:center;flex-wrap:wrap\"><button sc-camel-on-click=\"{{ saveClaude }}\" style=\"border:0;padding:7px 14px;border-radius:6px;background:#1d1b18;color:#faf9f6;font-size:12px\">儲存並使用 Claude<\u002Fbutton><button sc-camel-on-click=\"{{ clearClaude }}\" style=\"border:1px solid #d6d0c4;padding:7px 14px;border-radius:6px;background:#fff;font-size:12px\">清除<\u002Fbutton><span style=\"font-size:12px;color:#625d55\">{{ claudeMsg }}<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px;padding:14px;background:#fff;border:1px solid #e2ddd3;border-radius:10px\">\n            <span style=\"font-size:14px;font-weight:600\">Google OAuth 用戶端 ID<\u002Fspan>\n            <div style=\"font-size:12px;color:#625d55;line-height:1.6\">用 Google 登入需要的設定。這裡填的只對這台瀏覽器有效；要讓所有人都能用 Google 登入，網站管理者要把它寫進 src/app.html 的 GOOGLE_CLIENT_ID 並重新發布。建立步驟見 README 的「Google 整合」。<\u002Fdiv>\n            <input value=\"{{ clientDraft }}\" sc-camel-on-change=\"{{ onClientDraft }}\" placeholder=\"….apps.googleusercontent.com\" aria-label=\"Google OAuth 用戶端 ID\" style=\"padding:9px 11px;border:1px solid #e2ddd3;border-radius:6px;background:#fff;font-size:13px;outline:none\">\n            <button sc-camel-on-click=\"{{ saveClient }}\" style=\"align-self:flex-start;border:0;padding:7px 14px;border-radius:6px;background:#1d1b18;color:#faf9f6;font-size:12px\">儲存<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ hasToast }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1d1b18;color:#faf9f6;font-size:13px;padding:10px 18px;border-radius:6px;z-index:60;max-width:calc(100vw - 32px)\">{{ toast }}<sc-if value=\"{{ hasToastAct }}\" hint-placeholder-val=\"{{ false }}\"><button sc-camel-on-click=\"{{ runToastAct }}\" style=\"border:0;background:none;color:oklch(0.85 0.08 200);margin-left:12px;font-size:13px;text-decoration:underline;padding:0\">{{ toastActLabel }}<\u002Fbutton><\u002Fsc-if><sc-if value=\"{{ hasToastLink }}\" hint-placeholder-val=\"{{ false }}\"><a href=\"{{ toastLink }}\" target=\"_blank\" rel=\"noopener\" style=\"color:oklch(0.85 0.08 200);margin-left:12px\">開啟<\u002Fa><\u002Fsc-if><\u002Fdiv>\n<\u002Fsc-if>\n<div role=\"status\" aria-live=\"polite\" style=\"position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap\">{{ toast }}<\u002Fdiv>\n<\u002Fx-dc>\n<script>\n(function(){\n  var native = window.claude && typeof window.claude.complete === 'function' ? window.claude : null;\n  var CLAUDE_MODEL = 'claude-sonnet-5-5';\n  var SITE = location.origin + location.pathname;\n  function ls(k){ try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } }\n  // 金鑰：勾選「在這台電腦記住金鑰」時存在 localStorage，否則只存在這次工作階段（sessionStorage）\n  function sec(k){ try { return sessionStorage.getItem(k) || localStorage.getItem(k) || ''; } catch(e){ return ''; } }\n  function drop(k){ try { sessionStorage.removeItem(k); localStorage.removeItem(k); } catch(e){} }\n  // 需要使用者處理（登入、換金鑰）的錯誤：通知介面打開設定的對應分頁\n  function need(msg, tab){ try { window.dispatchEvent(new CustomEvent('lunyi-need-key',{detail:{msg:msg, tab:tab||'ai'}})); } catch(e){} var er=new Error(msg); er.code='NO_KEY'; return er; }\n  function fail(msg){ return new Error(msg); }\n  async function body(r){ try { return await r.json(); } catch(e){ return null; } }\n  function errMsg(j, r){ return (j && j.error && (j.error.message || j.error.status)) || ('HTTP ' + r.status); }\n\n  async function gemini(req){\n    var key = sec('lunyi-gemini-key');\n    if (!key) throw need('已選擇 Gemini，請到「設定 → 進階」貼上 Gemini 金鑰', 'adv');\n    var model = ls('lunyi-gemini-model') || 'gemini-3.8-flash';\n    var payload = { contents: req.messages.map(function(m){ return { role: m.role === 'assistant' ? 'model' : 'user', parts: [{ text: typeof m.content === 'string' ? m.content : JSON.stringify(m.content) }] }; }) };\n    if (req.system) payload.systemInstruction = { parts: [{ text: req.system }] };\n    var r;\n    try { r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent', { method:'POST', headers:{ 'content-type':'application/json', 'x-goog-api-key':key }, body: JSON.stringify(payload) }); }\n    catch(e) { throw fail('連不到 Gemini，請檢查網路'); }\n    var j = await body(r);\n    if (r.status === 400 && /API_KEY_INVALID|api.?key/i.test(JSON.stringify(j || ''))) throw need('Gemini 金鑰無效，請到「設定 → 進階」重新貼上', 'adv');\n    // 2026-09 起新金鑰不能用 2.5 系列模型，錯誤會長得像金鑰類型不對\n    if (r.status === 401 && /ACCESS_TOKEN_TYPE_UNSUPPORTED/.test(JSON.stringify(j || ''))) throw need('這把金鑰不能使用模型「' + model + '」，請到「設定 → 進階」把模型名稱清空（預設 gemini-3.8-flash）', 'adv');\n    if (r.status === 403) throw need('Gemini 拒絕這把金鑰（可能被封鎖或缺少限制），請到 AI Studio 重新建立', 'adv');\n    if (r.status === 404) throw need('找不到 Gemini 模型「' + model + '」，請到「設定 → 進階」修改', 'adv');\n    if (r.status === 429) throw fail('Gemini 免費額度暫時用完，請稍後再試');\n    if (!r.ok) throw fail('Gemini：' + errMsg(j, r));\n    var c = (j && j.candidates || [])[0];\n    if (!c && j && j.promptFeedback && j.promptFeedback.blockReason) throw fail('Gemini 擋下了這次請求（' + j.promptFeedback.blockReason + '）');\n    var text = (c && c.content && c.content.parts || []).filter(function(x){ return !x.thought; }).map(function(x){ return x.text || ''; }).join('');\n    if (!text && c && (c.finishReason === 'MAX_TOKENS' || c.finishReason === 'CONTINUATION')) throw fail('Gemini 的回應被截斷，請換一個模型或縮短內容');\n    return text;\n  }\n\n  async function claudeKey(req, key){\n    // Claude 5.x 預設會先思考，思考也算在 max_tokens 裡；上限放寬，只依實際用量計費\n    var b = { model: ls('lunyi-claude-model') || CLAUDE_MODEL, max_tokens: Math.max(req.max_tokens || 1500, 8000), messages: req.messages };\n    if (req.system) b.system = req.system;\n    var r;\n    try { r = await fetch('https://api.anthropic.com/v1/messages', { method:'POST', headers:{ 'content-type':'application/json', 'x-api-key':key, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' }, body: JSON.stringify(b) }); }\n    catch(e) { throw fail('連不到 Anthropic，請檢查網路'); }\n    var j = await body(r);\n    if (r.status === 401) throw need('Claude 金鑰無效或已過期，請到「設定 → 進階」重新輸入', 'adv');\n    if (r.status === 404) throw need('找不到 Claude 模型，請到「設定 → 進階」修改模型名稱', 'adv');\n    if (r.status === 429 || r.status === 529) throw fail('Claude 目前忙碌，請稍後再試');\n    if (!r.ok) throw fail('Claude：' + errMsg(j, r));\n    var out = (j && j.content || []).filter(function(c){ return c.type === 'text'; }).map(function(c){ return c.text; }).join('');\n    if (!out && j && j.stop_reason === 'max_tokens') throw fail('Claude 的回應被截斷，請縮短內容或換模型');\n    return out;\n  }\n\n  async function backend(req){\n    // Claude 5.x 預設會先思考，思考也算在 max_tokens 裡；上限放寬（伺服器端另有上限），只依實際用量計費\n    var b = { model: CLAUDE_MODEL, max_tokens: Math.max(req.max_tokens || 1500, 8000), messages: req.messages };\n    if (req.system) b.system = req.system;\n    var r;\n    try { r = await fetch('api/claude', { method:'POST', headers:{ 'content-type':'application/json', 'x-lunyi-code': ls('lunyi-code') }, body: JSON.stringify(b) }); }\n    catch(e) { throw need('還沒設定雲端 AI：請到「設定 → 進階」貼上 Gemini 或 Claude 金鑰', 'adv'); }\n    if (r.status === 404 || r.status === 405 || r.status === 501) throw need('還沒設定雲端 AI：請到「設定 → 進階」貼上 Gemini 或 Claude 金鑰', 'adv');\n    if (r.status === 401) throw need('網站存取碼錯誤，請到「設定 → 進階」輸入', 'adv');\n    var j = await body(r);\n    // 502 是 Anthropic 拒絕了請求（儲值用完、到了每月上限、金鑰沒綁工作區等），把原因顯示出來給管理者看\n    if (!r.ok) throw fail('網站後端 AI：' + errMsg(j, r));\n    var out = (j && j.content || []).filter(function(c){ return c.type === 'text'; }).map(function(c){ return c.text; }).join('');\n    if (!out && j && j.stop_reason === 'max_tokens') throw fail('Claude 的回應被截斷，請縮短內容');\n    return out;\n  }\n\n  // 目前用哪一個雲端 AI：使用者選的優先；沒選過時依序看 Claude 金鑰、Gemini 金鑰\n  // 使用者選定的服務沒有憑證時不默默改用另一把付費金鑰，只退回執行環境內建 AI 或「未連結」\n  function provider(){\n    var p = ls('lunyi-ai');\n    var has = { gemini: sec('lunyi-gemini-key'), claude: sec('lunyi-apikey') };\n    if (p && p !== 'native') return has[p] ? p : (native ? 'native' : '');\n    if (native) return 'native';\n    if (sec('lunyi-apikey')) return 'claude';\n    if (sec('lunyi-gemini-key')) return 'gemini';\n    return '';\n  }\n  window.__lunyiShim = !native;\n  window.__lunyiAi = { provider: provider, sec: sec, drop: drop, hasNative: !!native };\n  window.claude = { complete: async function(req){\n    if (typeof req === 'string') req = { messages:[{ role:'user', content:req }] };\n    var p = provider();\n    if (p === 'gemini') return gemini(req);\n    if (p === 'native' && native) return native.complete(req);\n    var key = sec('lunyi-apikey');\n    if (p === 'claude' && key) return claudeKey(req, key);\n    if (p === 'claude' && native) return native.complete(req);\n    return backend(req);\n  } };\n})();\n<\u002Fscript>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;layout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;reader&quot;,&quot;graph&quot;,&quot;chat&quot;,&quot;dash&quot;,&quot;matrix&quot;],&quot;default&quot;:&quot;reader&quot;,&quot;tsType&quot;:&quot;'reader'|'graph'|'chat'|'dash'|'matrix'&quot;},&quot;defaultMode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;both&quot;,&quot;en&quot;,&quot;zh&quot;],&quot;default&quot;:&quot;both&quot;,&quot;tsType&quot;:&quot;'both'|'en'|'zh'&quot;},&quot;autoTranslate&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nconst KEY = 'lunyi-v2';\nconst ACC = 'oklch(0.45 0.1 200)';\nconst HL = { y: 'oklch(0.94 0.07 95)', b: 'oklch(0.93 0.045 220)' };\n// 專案類別色：dataviz 參考色盤前 3 色。圖譜節點四散，任兩色都可能相鄰，validate_palette.js --pairs all\n// 只有前 3 色通過（色盲 ΔE 9.2、一般視覺 24.0）。色槽存在 fslots，第一次出現時分配，之後改名、刪除或同步都不變；\n// 沒有色槽的專案一律算「其他」灰色。綠松對比不足 3:1，所以專案名稱一定跟著色塊顯示。\nconst CAT = ['#2a78d6', '#eb6834', '#1baf7a'];\nconst CAT_OTHER = '#a8a196';\n// 依現有專案補齊色槽：保留舊的對應；新專案優先用從沒用過的色槽，再用已不存在的專案留下的色槽\nfunction slotMap(names, fslots) {\n  const map = { ...(fslots || {}) }, live = [...new Set(names)];\n  const has = f => Object.prototype.hasOwnProperty.call(map, f);\n  let changed = false;\n  // 舊資料可能有兩個存活的專案占同一色槽：依 names 順序（有論文的在前）保留第一個\n  const used = new Set();\n  live.forEach(f => { if (!has(f)) return; if (used.has(map[f])) { delete map[f]; changed = true; } else used.add(map[f]); });\n  live.forEach(f => {\n    if (has(f)) return;\n    const held = new Set(live.filter(has).map(x => map[x])), ever = new Set(Object.values(map));\n    const free = CAT.map((_, i) => i).filter(i => !held.has(i));\n    const slot = free.find(i => !ever.has(i)) ?? free[0];\n    if (slot === undefined) return;\n    // 已不存在的舊名稱如果占著這個色槽就清掉，之後重建同名專案才不會撞色\n    Object.keys(map).forEach(x => { if (x !== f && map[x] === slot && !live.includes(x)) delete map[x]; });\n    map[f] = slot; changed = true;\n  });\n  return { map, changed };\n}\n// 會被「在這台電腦記住 AI 登入」影響存放位置的機密資料\nconst SECRETS = ['lunyi-apikey', 'lunyi-gemini-key'];\n// 瀏覽器內建翻譯（Translator API，桌面版 Chrome 138 起）：免費、在使用者電腦上執行，只能翻譯\nconst HAS_TR = typeof self !== 'undefined' && 'Translator' in self;\nconst trCache = new Map();\nconst LANG_CODE = { 英文: 'en', 德文: 'de', 法文: 'fr', 日文: 'ja', 韓文: 'ko', 西班牙文: 'es', 義大利文: 'it', 葡萄牙文: 'pt', 俄文: 'ru', 簡體中文: 'zh', 中文: 'zh' };\n// 判斷原文語言：有假名是日文、有諺文是韓文、以漢字為主是中文；其餘看論文的語言欄位，預設英文\nfunction guessLang(p, text) {\n  if (/[぀-ヿ]/.test(text)) return 'ja';\n  if (/[가-힯]/.test(text)) return 'ko';\n  if ((text.match(/[一-鿿]/g) || []).length > text.length * 0.3) return 'zh';\n  return LANG_CODE[p.lang] || 'en';\n}\n// 第一次使用某個語言要下載語言包，必須在使用者點擊後的短時間內建立\nasync function getTranslator(src, onPct) {\n  if (trCache.has(src)) return trCache.get(src);\n  const opts = { sourceLanguage: src, targetLanguage: 'zh-Hant' };\n  const a = await self.Translator.availability(opts);\n  if (a === 'unavailable') { const e = new Error(`內建翻譯不支援這個語言（${src}）`); e.code = 'TR_UNSUPPORTED'; throw e; }\n  if (a !== 'available' && !(navigator.userActivation && navigator.userActivation.isActive)) {\n    const e = new Error('第一次使用內建翻譯要先下載語言包：請按「翻譯其餘段落」，或到「設定 → AI 模型」按「啟用離線翻譯」'); e.code = 'NEED_GESTURE'; throw e;\n  }\n  const t = await self.Translator.create({ ...opts, monitor(m) { m.addEventListener('downloadprogress', ev => onPct && onPct(Math.round((ev.loaded || 0) / (ev.total || 1) * 100))); } });\n  trCache.set(src, t);\n  return t;\n}\nconst MUTE = '#cdc7bb';\nconst ACC_DARK = 'oklch(0.36 0.09 200)';\nconst ce = React.createElement;\nconst norm = k => String(k).trim().toLowerCase();\nconst J = t => { const m = String(t).match(/[\\[{][\\s\\S]*[\\]}]/); try { return m ? JSON.parse(m[0]) : null; } catch (e) { return null; } };\nconst surname = p => (p.authors || '').split(/[,，\\s]/)[0] || '佚名';\nconst shortName = p => `${surname(p)} ${p.year}`.trim();\nconst today = () => new Date().toISOString().slice(0, 10);\nconst EMPTY_FORM = { title: '', authors: '', journal: '', year: '', folder: '', keywords: '', text: '' };\nconst PDFJS = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/';\nconst TESS = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';\nconst OCR_LANGS = 'eng+chi_tra';\nconst OCR_MAX = 60;\nconst GIST_FILE = 'lunyi-library.json';\n// 網站擁有者可在這裡填入預設的 Google OAuth 用戶端 ID，使用者就不必自己建立\nconst GOOGLE_CLIENT_ID = '';\nconst GSI = 'https://accounts.google.com/gsi/client';\nconst G_OFF_MSG = 'Google 登入暫時還沒開放，可以先不登入直接使用，論文一樣會存在這台電腦。';\nconst GAPI = 'https://www.googleapis.com';\nconst G_BASE = 'openid email profile https://www.googleapis.com/auth/drive.file';\nconst G_DRIVE_RO = 'https://www.googleapis.com/auth/drive.readonly';\nconst G_CAL = 'https://www.googleapis.com/auth/calendar.events';\nconst pad2 = n => String(n).padStart(2, '0');\nconst localDT = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`;\nconst esc = t => String(t == null ? '' : t).replace(/[&<>\"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;' }[c]));\nconst scriptLoads = {};\nconst loadScript = src => scriptLoads[src] || (scriptLoads[src] = new Promise((ok, fail) => {\n  const el = document.createElement('script'); el.src = src; el.onload = ok;\n  el.onerror = () => { delete scriptLoads[src]; el.remove(); fail(new Error('無法載入 Google 登入元件，請檢查網路')); };\n  document.head.appendChild(el);\n}));\nconst SYS_TR = '你是學術論文翻譯。使用者會給一個 JSON 字串陣列，每個元素是一段論文原文（可能是任何語言）。逐段翻譯成繁體中文（台灣學術用語），專有名詞首次出現時於括號保留原文。只輸出同樣長度的 JSON 字串陣列，不要任何說明。';\nconst SYS_META = '閱讀論文開頭文字，只輸出 JSON：{\"title\":\"原文標題\",\"authors\":\"第一作者姓, 名縮寫 等\",\"journal\":\"期刊或會議\",\"year\":\"年份\",\"language\":\"原文語言（繁中名稱）\",\"keywords\":[\"5–8 個英文小寫學術關鍵詞\"],\"tags\":[\"1–3 個繁中領域標籤\"]}';\n// 整理書目資訊：只根據論文原文擷取，找不到就留空（不准用記憶補，避免編造書目）\nconst SYS_BIB = '你是書目資料整理員。使用者會給一篇論文的原文開頭（含標題、作者、單位、頁首頁尾等）。只根據這段文字擷取書目資料，只輸出 JSON：{\"title\":\"原文標題\",\"authors\":\"全部作者，APA 格式：姓, 名縮寫., 姓, 名縮寫., & 姓, 名縮寫.（超過 20 位時列前 19 位、…、最後一位）\",\"journal\":\"期刊或會議全名\",\"year\":\"出版年（四位數）\",\"volume\":\"卷\",\"issue\":\"期\",\"pages\":\"起訖頁或文章編號\",\"doi\":\"10. 開頭的 DOI\",\"keywords\":[\"5–8 個英文小寫學術關鍵詞\"]}。中文、日文、韓文作者照原文寫法，用「、」分隔，不要轉成拼音或縮寫；標題用原文、不要翻譯。除了 keywords，文字裡找不到的欄位一律填空字串，絕對不要猜，也不要用你記得的資料補。';\nconst ORG_FIELDS = [['title', '標題'], ['authors', '作者'], ['journal', '期刊'], ['year', '年份'], ['volume', '卷'], ['issue', '期'], ['pages', '頁碼'], ['doi', 'DOI'], ['keywords', '關鍵詞']];\n// 對話裡要 AI「填完整／補齊／整理」書目資訊時，改走整理流程（會真的寫進論文，先讓使用者確認）\nconst ORG_V = '(填完整|填好|填上|填進|填入|補齊|補上|補完|補全|補足|整理|完善|校正|修正|更正)';\nconst ORG_N = '((?<!參考)書目|出處|doi|卷期|頁碼|引用格式|(論文|每篇|各篇|這篇|每一篇|所有論文)的?(基本)?(資訊|資料)|作者[、和與跟及]?(年份|期刊))';\nconst ORG_RE = new RegExp(ORG_V + '[^。？?]{0,14}' + ORG_N + '|' + ORG_N + '[^。？?]{0,14}' + ORG_V + '|\\\\b(fill|complete|fix|update|add)\\\\b[^.?]{0,30}\\\\b(doi|bibliograph|citation|metadata)', 'i');\nconst SYS_ASK = '你是研究助理，只根據使用者提供的文獻庫與筆記回答。用繁體中文，精簡、可條列。凡是引用某篇論文的觀點，在句末標註方括號 id，例如 [p1] 或 [p1][p3]。資料不足就直說，不要編造。';\n\nconst SEED = {\n  papers: [\n    { id: 'p1', title: 'Attention Is All You Need', authors: 'Vaswani, A. 等', journal: 'NeurIPS', year: '2017', folder: '語言模型', lang: '英文', tags: ['NLP', '模型架構'], keywords: ['transformer', 'self-attention', 'machine translation', 'residual connection'], cites: ['p3'], paras: [\n      { en: 'The Transformer replaces recurrence and convolution with an architecture built entirely on attention, letting every position in a sequence attend directly to every other position.', zh: 'Transformer 以完全建立在注意力機制上的架構取代遞迴與卷積，讓序列中的每個位置都能直接關注其他所有位置。', hl: 'y' },\n      { en: 'Multi-head self-attention projects queries, keys and values into several subspaces, so the model can capture different kinds of relationships in parallel.', zh: '多頭自注意力（multi-head self-attention）將查詢、鍵與值投影到多個子空間，使模型能平行捕捉不同類型的關係。' },\n      { en: 'Each sub-layer is wrapped in a residual connection followed by layer normalization, which keeps the deep stack of encoder and decoder layers trainable.', zh: '每個子層都包覆殘差連接（residual connection）並接上層正規化，讓深層的編碼器與解碼器堆疊得以訓練。', hl: 'b' },\n      { en: 'Because computation is no longer sequential across time steps, training parallelizes well, and the model reached state-of-the-art translation quality at a fraction of prior training cost.', zh: '由於運算不再沿時間步驟依序進行，訓練可高度平行化；模型以遠低於以往的訓練成本，達到當時最佳的翻譯品質。' }\n    ] },\n    { id: 'p2', title: 'BERT: Pre-training of Deep Bidirectional Transformers for Language Understanding', authors: 'Devlin, J. 等', journal: 'NAACL', year: '2019', folder: '語言模型', lang: '英文', tags: ['NLP', '預訓練'], keywords: ['transformer', 'pre-training', 'bidirectional', 'fine-tuning'], cites: ['p1'], paras: [\n      { en: 'BERT pre-trains a deep bidirectional Transformer encoder on unlabeled text, conditioning on both left and right context in every layer.', zh: 'BERT 在未標註文本上預訓練深層雙向 Transformer 編碼器，每一層都同時參考左右兩側的上下文。' },\n      { en: 'Two pre-training objectives are used: masked language modeling, which predicts randomly hidden tokens, and next sentence prediction.', zh: '預訓練使用兩個目標：遮罩語言模型（masked language modeling），預測被隨機遮蔽的詞元；以及下一句預測。', hl: 'y' },\n      { en: 'The pre-trained model is fine-tuned with a single additional output layer, reaching strong results on question answering and natural language inference benchmarks.', zh: '預訓練模型只需加上一層輸出層即可微調，在問答與自然語言推論基準上取得優異成績。' }\n    ] },\n    { id: 'p3', title: 'Deep Residual Learning for Image Recognition', authors: 'He, K. 等', journal: 'CVPR', year: '2016', folder: '電腦視覺', lang: '英文', tags: ['電腦視覺', '模型架構'], keywords: ['residual connection', 'deep networks', 'image recognition'], cites: [], paras: [\n      { en: 'Very deep networks suffer from a degradation problem: adding more layers can raise training error, not only test error.', zh: '極深的網路會出現退化問題：增加層數反而可能提高訓練誤差，而不只是測試誤差。' },\n      { en: 'Residual learning reformulates layers to learn a residual function relative to their input, implemented with identity shortcut connections.', zh: '殘差學習將網路層改寫為學習相對於輸入的殘差函數，並以恆等捷徑連接（identity shortcut）實作。', hl: 'y' },\n      { en: 'With this design, networks more than 100 layers deep can be trained effectively, and the approach won the ImageNet 2015 classification task.', zh: '採用此設計後，超過 100 層的網路也能有效訓練，並贏得 ImageNet 2015 分類競賽。' }\n    ] },\n    { id: 'p4', title: 'Language Models are Few-Shot Learners', authors: 'Brown, T. 等', journal: 'NeurIPS', year: '2020', folder: '語言模型', lang: '英文', tags: ['NLP', '預訓練'], keywords: ['transformer', 'pre-training', 'few-shot', 'scaling'], cites: ['p1', 'p2'], paras: [\n      { en: 'Scaling an autoregressive Transformer language model to 175 billion parameters substantially improves task-agnostic few-shot performance.', zh: '將自迴歸 Transformer 語言模型擴展到 1,750 億參數，可大幅提升不限任務的少樣本（few-shot）表現。' },\n      { en: 'Tasks are specified purely through text prompts containing a few demonstrations, with no gradient updates or fine-tuning.', zh: '' },\n      { en: 'The paper also discusses limitations, including benchmark data contamination and the broader societal risks of large language models.', zh: '' }\n    ] }\n  ],\n  links: [{ a: 'p1', b: 'p3', note: 'Transformer 每個子層外都沿用 ResNet 的殘差連接' }],\n  notes: [{ id: 'n1', paperId: 'p1', para: 1, text: '多頭 = 多組投影平行做注意力再串接。BERT 的編碼器就是這個模組的堆疊。', date: '2026-09-20' }],\n  qa: []\n};\n\n// ---- 1e 比較矩陣：列是論文、欄是比較面向；格子存在 paper.mx[欄位 id] ----\n// 格子：{ t 內容, g 分類標籤, ev 出處 [{ p 段落（從 0 起算）, q 逐字引文, v 引文在原文找到, mv AI 原本標的段落, u 使用者指定段落 }],\n//        na 原文未提及, by 'ai'|'me', cf 已確認, at 最後修改時間, cut [送出段數, 全文段數], nb 出處段落裡找不到的數字 }；清除的格子留 { at } 當墓碑\nconst MX_DEFAULT = [\n  { id: 'aim', label: '研究目的／問題', ai: true, tag: '', ask: '這篇論文要回答的研究問題或研究目的，以及它想補足的缺口；原文有列出研究問題或假設時依序簡述。用作者自己的說法，不要評論。' },\n  { id: 'method', label: '研究方法', ai: true, tag: '方法類別，例如：實驗、問卷調查、訪談、個案研究、模型提出、文獻回顧', ask: '研究設計與分析方法，例如實驗、問卷調查、訪談、個案研究、次級資料分析，或提出的模型與評估方式；寫出方法或模型的名稱，不要只寫「提出一種新方法」，也不要寫結果。' },\n  { id: 'data', label: '資料／樣本', ai: true, tag: '資料類型，例如：公開資料集、問卷樣本、訪談對象、實驗受試者、次級資料、未標註語料', ask: '使用的資料集或研究對象：來源、規模（人數、筆數）、蒐集期間與地點；數字和單位照原文寫。原文沒寫規模就不要寫。' },\n  { id: 'finding', label: '主要發現', ai: true, tag: '', ask: '最主要的 1–2 個結果或結論；有數值結果時保留數值、單位與比較基準，照原文寫。' },\n  { id: 'limit', label: '限制與未來研究', ai: true, tag: '限制類型，例如：樣本規模、單一情境、橫斷面資料、缺少比較基準、資料汙染', ask: '作者自己提到的研究限制、效度威脅或建議的未來研究方向；作者沒寫就判定為原文未提及，不要自行評論。' },\n  { id: 'mine', label: '與我的研究', ai: false,
