  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ition:transform .2s ease;box-shadow:0 0 40px rgba(0,0,0,0.18)}\n.ly-root[data-sb=\"true\"] .ly-sb{transform:none}\n.ly-mainwrap{min-height:100vh;grid-template-rows:44px auto!important}\n.ly-top{position:sticky;top:0;z-index:5}\n.ly-cols3,.ly-cols2{display:flex!important;flex-direction:column}\n.ly-main,.ly-gmain{overflow:visible!important}\n.ly-side{border-left:0!important;border-top:1px solid #e2ddd3;overflow:visible!important}\n.ly-article{padding:20px 16px 48px!important}.ly-h1{font-size:23px!important}\n.ly-pcols{grid-template-columns:minmax(0,1fr)!important;gap:12px!important}\n.ly-graph{margin:24px 64px 40px!important;height:520px}\n.ly-node{width:112px!important;padding:7px 8px!important}\n.ly-pad{padding:0 16px!important}.ly-askbar{padding:12px 16px!important}\n.ly-form4{grid-template-columns:1fr 1fr!important}\n.ly-dash{padding:18px 16px 48px!important}\n.ly-kpis{grid-template-columns:1fr 1fr!important}\n.ly-dash-grid{grid-template-columns:minmax(0,1fr)!important}\n.ly-prow{grid-template-columns:minmax(0,1fr) 128px!important}\n.ly-frow{grid-template-columns:minmax(0,1fr) 72px 84px!important}.ly-pextra{display:none!important}\n.ly-kwrow{grid-template-columns:minmax(118px,40%) minmax(0,1fr)!important}\n.ly-setbox{grid-template-columns:minmax(0,1fr)!important;grid-template-rows:auto minmax(0,1fr);height:calc(100vh - 24px)!important}\n.ly-setnav{flex-direction:row!important;overflow-x:auto;border-right:0!important;border-bottom:1px solid #e2ddd3;padding:8px!important}\n.ly-setnav .ly-sbrow{width:auto}.ly-setlabel{display:none}\n.ly-login{padding:30px 20px 20px!important}\n.ly-tools button,.ly-tools a,.ly-ptools button{min-height:40px}\n.ly-sbrow{min-height:40px}\nbutton[aria-label=\"開啟側欄\"]{width:44px!important;height:44px!important}\n.ly-sb button[aria-label$=\"的選項\"],#lunyi-newproj-btn,.ly-sb button[aria-label=\"收合側欄\"]{width:36px!important;height:36px!important}\n.ly-setclose{position:sticky!important;top:0!important;align-self:flex-end;margin-bottom:-30px;z-index:2;background:#faf9f6!important}\n.ly-homein{padding:22px 16px 60px!important}\n.ly-rec{grid-template-columns:minmax(0,1fr)!important}\n}\n@media (max-width:480px){\n.ly-crumb0,.ly-crumbsep{display:none!important}\n.ly-setnav .ly-sbrow>span[aria-hidden]{display:none}.ly-setnav .ly-sbrow{padding:5px 8px}\n}<\u002Fstyle>\n<\u002Fhelmet>\n\n<div class=\"ly-root\" data-sb=\"{{ sbAttr }}\" data-ov=\"{{ ovAttr }}\" style=\"height:100vh;display:grid;grid-template-columns:{{ sbCols }};min-height:0\">\n  <a href=\"#\" class=\"ly-skip\" sc-camel-on-click=\"{{ skipToMain }}\">跳到內容<\u002Fa>\n  <aside class=\"ly-sb\" aria-label=\"側欄\" style=\"background:#f1eee8;border-right:1px solid #e2ddd3;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden\">\n    <div class=\"ly-acct\" sc-camel-on-blur=\"{{ acctBlur }}\" style=\"padding:8px 8px 4px;position:relative\">\n      <button id=\"lunyi-acct-btn\" class=\"ly-sbrow\" sc-camel-on-click=\"{{ toggleAcct }}\" aria-controls=\"lunyi-acct-menu\" aria-haspopup=\"{{ acctPopup }}\" aria-expanded=\"{{ acctAttr }}\" title=\"{{ acctTitle }}\" style=\"gap:9px;padding:6px 8px\">\n        <span style=\"width:28px;height:28px;border-radius:7px;background:{{ av.bg }};color:#fff;display:grid;place-items:center;font-size:13px;font-weight:600;flex-shrink:0;overflow:hidden;position:relative\">{{ av.initial }}<span aria-hidden=\"true\" style=\"position:absolute;inset:0;background:{{ av.imgBg }}\"><\u002Fspan><\u002Fspan>\n        <span style=\"min-width:0;flex:1;display:flex;flex-direction:column;line-height:1.3\"><span style=\"font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ av.name }}<\u002Fspan><span style=\"font-size:11px;color:#625d55;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ av.sub }}<\u002Fspan><\u002Fspan>\n        <span aria-hidden=\"true\" style=\"font-size:10px;color:#625d55\">▾<\u002Fspan>\n      <\u002Fbutton>\n      <sc-if value=\"{{ acctOpen }}\" h -size:11px;color:#625d55\">{{ hp.meta }}<\u002Fspan><\u002Fbutton>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#625d55;white-space:nowrap\">{{ hp.prog }}<\u002Fspan>\n              <button sc-camel-on-click=\"{{ hp.onLeave }}\" aria-label=\"{{ hp.leaveLabel }}\" title=\"{{ hp.leaveLabel }}\" style=\"border:1px solid #e2ddd3;background:transparent;border-radius:5px;padding:4px 9px;font-size:12px;color:#625d55;white-space:nowrap\" style-hover=\"border-color:#bdb6a9\">移出<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ home.noPapers }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:13px;color:#625d55;line-height:1.7;background:#fff;border:1px dashed #d6d0c4;border-radius:8px;padding:14px 16px\">這是一個乾淨的新專案。從下方的推薦把論文加進來，或按「新增論文到這個專案」。論文仍會留在「全部論文」，同一篇可以放進好幾個專案。<\u002Fdiv><\u002Fsc-if>\n        <\u002Fsection>\n\n        <section aria-labelledby=\"lunyi-h-recs\" style=\"display:flex;flex-direction:column;gap:8px\">\n          <div><h2 id=\"lunyi-h-recs\" style=\"margin:0;font-size:16px;font-weight:600\">從全部論文推薦<\u002Fh2><div style=\"font-size:12px;color:#625d55;margin-top:3px\">依研究方向、專案裡論文的關鍵詞與引用，找出還沒加入、最相關的{{ home.recN }}<\u002Fdiv><\u002Fdiv>\n          <div class=\"ly-rec\" style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px\">\n            <sc-for list=\"{{ home.recs }}\" as=\"rc\" hint-placeholder-count=\"0\">\n              <div style=\"background:#fff;border:1px solid #e2ddd3;border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0\">\n                <button sc-camel-on-click=\"{{ rc.onOpen }}\" title=\"在全部論文中開啟\" style=\"border:0;background:transparent;text-align:left;padding:0;font-family:'Noto Serif TC',serif;font-size:14px;font-weight:600;line-height:1.4\" style-hover=\"color:oklch(0.42 0.1 200)\">{{ rc.title }}<\u002Fbutton>\n                <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#625d55\">{{ rc.meta }}<\u002Fspan>\n                <div style=\"display:flex;flex-direction:column;gap:3px\"><sc-for list=\"{{ rc.why }}\" as=\"w\" hint-placeholder-count=\"1\"><span style=\"font-size:12px;color:oklch(0.36 0.09 200);line-height:1.5\">・{{ w }}<\u002Fspan><\u002Fsc-for><\u002Fdiv>\n                <div style=\"flex:1\"><\u002Fdiv>\n                <button sc-camel-on-click=\"{{ rc.onJoin }}\" aria-label=\"{{ rc.joinLabel }}\" style=\"align-self:flex-start;border:0;background:#1d1b18;color:#faf9f6;border-radius:6px;padding:5px 12px;font-size:12px\">加入專案<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-if value=\"{{ home.noRecs }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:13px;color:#625d55;line-height:1.7\">{{ home.recEmpty }}<\u002Fdiv><\u002Fsc-if>\n        <\u002Fsection>\n\n        <section aria-labelledby=\"lunyi-h-links\" style=\"display:flex;flex-direction:column;gap:8px\">\n          <div><h2 id=\"lunyi-h-links\" style=\"margin:0;font-size:16px;font-weight:600\">推薦串聯<\u002Fh2><div style=\"font-size:12px;color:#625d55;margin-top:3px\">專案裡有共同關鍵詞或引用關係、但還沒手動串聯的論文；加入後會出現在閱讀器的串聯面板與圖譜<\u002Fdiv><\u002Fdiv>\n          <sc-for list=\"{{ home.links }}\" as=\"lk\" hint-placeholder-count=\"0\">\n            <div style=\"display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #e2ddd3;border-radius:8px;padding:10px 12px\">\n              <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:3px\"><span style=\"font-size:13px;line-height:1.5\"><span style=\"font-family:'Noto Serif TC',serif;font-weight:600\">{{ lk.a }}<\u002Fspan><span style=\"color:#625d55\"> ↔ <\u002Fspan><span style=\"font-family:'Noto Serif TC',serif;font-weight:600\">{{ lk.b }}<\u002Fspan><\u002Fspan><span style=\"font-size:12px;color:#625d55\">{{ lk.note }}<\u002Fspan><\u002Fdiv>\n              <button sc-camel-on-click=\"{{ lk.onAdd }}\" style=\"border:1px solid #1d1b18;background:#fff;border-radius:6px;padding:5px 12px;font-size:12px;white-space:nowrap\">加入串聯<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ home.noLinks }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:13px;color:#625d55;line-height:1.7\">{{ home.linkEmpty }}<\u002Fdiv><\u002Fsc-if>\n        <\u002Fsection>\n\n        <section aria-labelledby=\"lunyi-h-search\" style=\"display:flex;flex-direction:column;gap:8px\">\n          <div><h2 id=\"lunyi-h-search\" style=\"margin:0;font-size:16px;font-weight:600\">找新文獻<\u002Fh2><div style=\"font-size:12px;color:#625d55;margin-top:3px\">用研究方向的關鍵詞到 Google 學術搜尋還沒收錄的論文。按下才會在新分頁開啟，網站不會傳送你的資料。<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n            <sc-for list=\"{{ home.searches }}\" as=\"sr\" hint-placeholder-count=\"0\"><a href=\"{{ sr.href }}\" target=\"_blank\" rel=\"noopener\" style=\"border:1px solid #d6d0c4;background:#fff;border-radius:999px;padding:5px 12px;font-size:12px;text-decoration:none;color:#1d1b18\">{{ sr.label }} ↗<\u002Fa><\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-if value=\"{{ home.noSearch }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:13px;color:#625d55\">填寫研究方向後，這裡會出現搜尋連結。<\u002Fdiv><\u002Fsc-if>\n        <\u002Fsection>\n      <\u002Fdiv>\n    <\u002Fmain>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isA }}\" hint-placeholder-val=\"{{ true }}\">\n    <div class=\"ly-cols2\" style=\"display:grid;grid-template-columns:{{ readerCols }};min-height:0\">\n      <main class=\"ly-main\" style=\"min-height:0;overflow:auto;background:#faf9f6\">\n        <sc-if value=\"{{ hasPaper }}\" hint-placeholder-val=\"{{ true }}\">\n          <sc-if value=\"{{ showIntro }}\" hint-placeholder-val=\"{{ false }}\">\n            <div role=\"note\" style=\"max-width:912px;margin:18px auto 0;padding:12px 16px;background:#fff;border:1px solid #e2ddd3;border-radius:8px;display:flex;gap:12px;align-items:flex-start;font-size:13px;line-height:1.7\">\n              <span style=\"flex:1\"><b>歡迎使用論憶<\u002Fb>：上傳外文論文後可以中英對照閱讀、畫螢光與寫筆記，論文之間的引用與共同主題會自動串聯。現在的 {{ introN }} 篇是示範論文，可以直接試用，也可以刪掉；按左側「＋ 新增論文」加入你的第一篇。<\u002Fspan>\n              <button sc-camel-on-click=\"{{ closeIntro }}\" style=\"border:1px solid #d6d0c4;background:#fff;border-radius:6px;padding:4px 12px;font-size:12px;white-space:nowrap\">知道了<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ mxBackOn }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"max-width:1000px;margin:14px auto 0;padding:0 44px\"><button sc-camel-on-click=\"{{ mxBackGo }}\" style=\"border:1px solid #d6d0c4;background:#fff;border-radius:6px;padding:5px 12px;font-size:12px\">← 回到比較矩陣：{{ mxBackLabel }}<\u002Fbutton><\u002Fdiv><\u002Fsc-if>\n          <article class=\"ly-article\" style=\"max-width:1000px;margin:0 auto;padding:34px 44px 96px\">\n            <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:#625d55;letter-spacing:0.03em\">\n              <span>{{ curMeta }}<\u002Fspan><span>{{ curLang }}<\u002Fspan>\n              <span style=\"display:inline-flex;flex-wrap:wrap;gap:4px;align-items:center;font-family:'Noto Sans TC',sans-serif;letter-spacing:0\">\n                <sc-for list=\"{{ curProj }}\" as=\"cp\" hint-placeholder-count=\"1\"><span style=\"display:inline-flex;align-items:center;gap:4px;border:1px solid #e2ddd3;background:#fff;border-radius:4px;padding:1px 1px 1px 6px;font-size:11px;color:#37352f\"><span style=\"width:7px;height:7px;border-radius:2px;background:{{ cp.swatch }};box-shadow:{{ cp.ring }}\"><\u002Fspan>{{ cp.name }}<button sc-camel-on-click=\"{{ cp.onRemove }}\" aria-label=\"{{ cp.rmLabel }}\" title=\"{{ cp.rmLabel }}\" style=\"border:0;background:transparent;color:#625d55;font-size:10px;padding:1px 4px;border-radius:3px\" style-hover=\"background:#ece8e0\">✕<\u002Fbutton><\u002Fspan><\u002Fsc-for>\n                <sc-raw-select value=\"{{ joinVal }}\" sc-camel-on-change=\"{{ onJoinCur }}\" title=\"加入專案\" aria-label=\"加入專案\" style=\"border:1px dashed #bdb6a9;background:transparent;border-radius:4px;font-size:11px;padding:1px 3px;color:#625d55\">\n                  <option value=\"\">＋ 加入專案<\u002Foption>\n                  <sc-for list=\"{{ joinable }}\" as=\"jn\" hint-placeholder-count=\"0\"><option value=\"{{ jn }}\">{{ jn }}<\u002Foption><\u002Fsc-for>\n                  <option value=\"__new\">建立新專案…<\u002Foption>\n                <\u002Fsc-raw-select>\n                <sc-if value=\"{{ joinReady }}\" hint-placeholder-val=\"{{ false }}\"><button sc-camel-on-click=\"{{ doJoinCur }}\" aria-label=\"{{ joinBtnAria }}\" style=\"border:0;background:#1d1b18;color:#faf9f6;border-radius:4px;padding:2px 9px;font-size:11px\">{{ joinBtn }}<\u002Fbutton><\u002Fsc-if>\n              <\u002Fspan>\n            <\u002Fdiv>\n            <sc-if value=\"{{ editing }}\" hint-placeholder-val=\"{{ false }}\">\n              <div role=\"group\" aria-label=\"編輯論文資訊\" style=\"margin-top:12px;display:flex;flex-direction:column;gap:8px;background:#fff;border:1px solid #e2ddd3;border-radius:8px;padding:12px\">\n                <input id=\"lunyi-edit-title\" value=\"{{ em.title }}\" sc-camel-on-change=\"{{ onEm.title }}\" aria-label=\"標題\" placeholder=\"標題\" style=\"padding:9px 11px;border:1px solid #e2ddd3;border-radius:6px;background:#fff;font-size:13px;outline:none;min-width:0\">\n                <div class=\"ly-form4\" style=\"display:grid;grid-template-columns:1.6fr 1.3fr 0.7fr;gap:8px\">\n                  <input value=\"{{ em.authors }}\" sc-camel-on-change=\"{{ onEm.authors }}\" aria-label=\"作者\" placeholder=\"作者\" style=\"padding:9px 11px;border:1px solid #e2ddd3;border-radius:6px;background:#fff;font-size:13px;outline:none;min-width:0\">\n                  <input value=\"{{ em.journal }}\" sc-camel-on-change=\"{{ onEm.journal }}\" aria-label=\"期刊或會議\" placeholder=\"期刊 / 會議\" style=\"padding:9px 11px;border:1px solid #e2ddd3;border-radius:6px;background:#fff;font-size:13px;outline:none;min-width:0\">\n                  <input value=\"{{ em.year }}\" sc-camel-on-change=\"{{ onEm.year }}\" aria-label=\"年份\" placeholder=\"年份\" style=\"padding:9px 11px;border:1px solid #e2ddd3;border-radius:6px;background:#fff;font-size:13px;outline:none;min-width:0\">\n                <\u002Fdiv>\n                <div class=\"ly-form4\" style=\"display:grid;grid-template-columns:0.6fr 0.6fr 0.9fr 1.9fr;gap:8px\">\n                  <input value=\"{{ em.volume }}\" sc-camel-on-change=\"{{ onEm.volume }}\" aria-label=\"卷\" placeholder=\"卷\" style=\"padding:9px 11px;border:1px solid #e2ddd3;border-radius:6px;background:#fff;font-size:13px;outline:none;min-width:0\">\n                  <input value=\"{{ em.issue }}\" sc-camel-on-change=\"{{ onEm.issue }}\" aria-label=\"期\" placeholder=\"期\" style=\"padding:9px 11px;border:1px solid #e2ddd3;border-radius:6px;background:#fff;font-size:13px;outline:none;min-width:0\">\n                  <input value=\"{{ em.pages }}\" sc-camel-on-change=\"{{ onEm.pages }}\" aria-label=\"頁碼\" placeholder=\"頁碼\" style=\"padding:9px 11px;border:1px solid #e2ddd3;border-radius:6px;background:#fff;font-size:13px;outline:none;min-width:0\">\n                  <input value=\"{{ em.doi }}\" sc-camel-on-change=\"{{ onEm.doi }}\" aria-label=\"DOI\" placeholder=\"DOI（10. 開頭）\" style=\"padding:9px 11px;border:1px solid #e2ddd3;border-radius:6px;background:#fff;font-size:13px;outline:none;min-width:0\">\n                <\u002Fdiv>\n                <input value=\"{{ em.keywords }}\" sc-camel-on-change=\"{{ onEm.keywords }}\" aria-label=\"關鍵詞（用逗號分開）\" placeholder=\"關鍵詞（用逗號分開，例如：transformer, self-attention）\" style=\"padding:9px 11px;border:1px solid #e2ddd3;border-radius:6px;background:#fff;font-size:13px;outline:none;min-width:0\">\n                <div style=\"display:flex;gap:8px;justify-content:flex-end\"><button sc-camel-on-click=\"{{ cancelEdit }}\" style=\"border:1px solid #d6d0c4;background:#fff;border-radius:6px;padding:6px 14px;font-size:12px\">取消<\u002Fbutton><button sc-camel-on-click=\"{{ saveEdit }}\" style=\"border:0;background:#1d1b18;color:#faf9f6;border-radius:6px;padding:6px 14px;font-size:12px\">儲存<\u002Fbutton><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <h1 class=\"ly-h1\" style=\"font-family:'Noto Serif TC',serif;font-size:30px;line-height:1.3;font-weight:600;margin:10px 0 8px;text-wrap:pretty\">{{ cur.title }}<\u002Fh1>\n            <div style=\"font-size:14px;color:#625d55\">{{ cur.authors }}<\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-top:16px\">\n              <sc-for list=\"{{ curTags }}\" as=\"tg\" hint-placeholder-count=\"2\"><span style=\"font-size:12px;padding:3px 9px;border-radius:4px;background:#1d1b18;color:#faf9f6\">{{ tg }}<\u002Fspan><\u002Fsc-for>\n              <sc-for list=\"{{ curKeywords }}\" as=\"kw\" hint-placeholder-count=\"3\"><button sc-camel-on-click=\"{{ kw.onClick }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;padding:3px 9px;border-radius:4px;border:1px solid #d6d0c4;background:transparent;white-space:nowrap\" style-hover=\"border-color:#1d1b18\">{{ kw.label }}<\u002Fbutton><\u002Fsc-for>\n            <\u002Fdiv>\n            <div class=\"ly-tools\" style=\"display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:26px 0 12px;padding-bottom:14px;border-bottom:1px solid #e2ddd3\">\n              <div style=\"display:flex;gap:2px;background:#ece8e0;padding:3px;border-radius:6px\">\n                <sc-for list=\"{{ modeBtns }}\" as=\"m\" hint-placeholder-count=\"3\"><button sc-camel-on-click=\"{{ m.onClick }}\" aria-pressed=\"{{ m.pressed }}\" style=\"border:0;padding:4px 12px;border-radius:4px;font-size:12px;background:{{ m.bg }}\">{{ m.label }}<\u002Fbutton><\u002Fsc-for>\n              <\u002Fdiv>\n              <sc-if value=\"{{ hasMissing }}\" hint-placeholder-val=\"{{ false }}\">\n                <button sc-camel-on-click=\"{{ translateAll }}\" style=\"border:1px solid oklch(0.45 0.1 200);color:oklch(0.4 0.1 200);background:transparent;padding:5px 12px;border-radius:5px;font-size:12px\">{{ translateAllLabel }}<\u002Fbutton>\n              <\u002Fsc-if>\n              <div style=\"flex:1\"><\u002Fdiv>\n              <button sc-camel-on-click=\"{{ startEdit }}\" style=\"border:0;background:none;font-size:12px;color:#625d55;padding:4px 6px\" style-hover=\"color:#1d1b18\">編輯資訊<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ orgThis }}\" title=\"讓 AI 讀這篇的原文，補齊標題、作者、期刊、年份、卷期頁、DOI 與關鍵詞\" style=\"border:0;background:none;font-size:12px;color:oklch(0.42 0.1 200);padding:4px 6px\" style-hover=\"color:#1d1b18\">AI 整理資訊<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ copyApa }}\" style=\"border:0;background:none;font-size:12px;color:#625d55;padding:4px 6px\" style-hover=\"color:#1d1b18\">複製 APA<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ copyBib }}\" style=\"border:0;background:none;font-size:12px;color:#625d55;padding:4px 6px\" style-hover=\"color:#1d1b18\">複製 BibTeX<\u002Fbutton>\n              <a href=\"{{ scholarUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;border:0;background:none;font-size:12px;color:#625d55;padding:4px 6px;text-decoration:none\" style-hover=\"color:#1d1b18\">Google 學術<\u002Fa>\n              <button sc-camel-on-click=\"{{ exportDoc }}\" style=\"border:0;background:none;font-size:12px;color:#625d55;padding:4px 6px\" style-hover=\"color:#1d1b18\">匯出 Google 文件<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ togglePlan }}\" style=\"border:0;background:none;font-size:12px;color:#625d55;padding:4px 6px\" style-hover=\"color:#1d1b18\">排入日曆<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ deletePaper }}\" style=\"border:0;background:none;font-size:12px;color:#625d55;padding:4px 6px\" style-hover=\"color:oklch(0.5 0.15 25)\">刪除<\u002Fbutton>\n            <\u002Fdiv>\n            <sc-if value=\"{{ planOpen }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;padding:10px 12px;background:#fff;border:1px solid #e2ddd3;border-radius:6px\">\n                <span style=\"font-size:12px\">排入 Google 日曆（1 小時）<\u002Fspan>\n                <input type=\"datetime-local\" value=\"{{ planAt }}\" sc-camel-on-change=\"{{ onPlanAt }}\" style=\"padding:5px 8px;border:1px solid #e2ddd3;border-radius:5px;font-size:12px\">\n                <button sc-camel-on-click=\"{{ planReading }}\" style=\"border:0;padding:7px 14px;border-radius:5px;background:#1d1b18;color:#faf9f6;font-size:12px\">加到日曆<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ togglePlan }}\" style=\"border:0;background:none;font-size:12px;color:#625d55;padding:4px 6px\">取消<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"font-size:12px;color:#625d55;margin-bottom:8px\">點選段落可加螢光、筆記或重新翻譯。<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:4px\">\n              <sc-for list=\"{{ paras }}\" as=\"p\" hint-placeholder-count=\"3\">\n                <div class=\"ly-para\" data-pi=\"{{ p.idx }}\" sc-camel-on-click=\"{{ p.onClick }}\" style=\"display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;padding:16px 14px;border-radius:6px;background:{{ p.bg }};box-shadow:{{ p.ring }};cursor:pointer\">\n                  <button class=\"ly-pnum\" sc-camel-on-click=\"{{ p.onNum }}\" aria-expanded=\"{{ p.selAttr }}\" aria-label=\"{{ p.numLabel }}\">{{ p.n }}<\u002Fbutton>\n                  <div style=\"display:flex;flex-direction:column;gap:10px\">\n                    <div class=\"ly-pcols\" style=\"display:grid;grid-template-columns:{{ p.cols }};gap:28px\">\n                      <sc-if value=\"{{ p.showEn }}\" hint-placeholder-val=\"{{ true }}\"><p lang=\"{{ srcLang }}\" style=\"margin:0;font-family:'Noto Serif TC',Georgia,serif;font-size:15px;line-height:1.7;text-wrap:pretty\">{{ p.en }}<\u002Fp><\u002Fsc-if>\n                      <sc-if value=\"{{ p.showZh }}\" hint-placeholder-val=\"{{ true }}\">\n                        <div>\n                          <sc-if value=\"{{ p.hasZh }}\" hint-placeholder-val=\"{{ true }}\"><p style=\"margin:0;font-size:15px;line-height:1.85;color:#2c2925;text-wrap:pretty\">{{ p.zh }}<\u002Fp><\u002Fsc-if>\n                          <sc-if value=\"{{ p.byBuiltin }}\" hint-placeholder-val=\"{{ false }}\"><span title=\"這段由瀏覽器內建翻譯產生，點段落可用 AI 重新翻譯\" style=\"display:inline-block;margin-top:6px;font-size:11px;color:#625d55;border:1px solid #e2ddd3;border-radius:4px;padding:1px 6px\">內建翻譯<\u002Fspan><\u002Fsc-if>\n                          <sc-if value=\"{{ p.busy }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:12px;color:oklch(0.45 0.1 200)\">翻譯中…<\u002Fspan><\u002Fsc-if>\n                          <sc-if value=\"{{ p.idle }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:12px;color:#625d55\">尚未翻譯<\u002Fspan><\u002Fsc-if>\n                        <\u002Fdiv>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                    <sc-for list=\"{{ p.notes }}\" as=\"pn\" hint-placeholder-count=\"0\"><div style=\"font-size:13px;line-height:1.6;background:#fff;border:1px solid #e2ddd3;padding:6px 10px;border-radius:4px\">✎ {{ pn }}<\u002Fdiv><\u002Fsc-for>\n                    <sc-if value=\"{{ p.sel }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div class=\"ly-ptools\" style=\"display:flex;flex-wrap:wrap;gap:6px\">\n                        <button sc-camel-on-click=\"{{ p.onHlY }}\" style=\"border:1px solid #d6d0c4;background:oklch(0.94 0.07 95);border-radius:4px;padding:4px 10px;font-size:12px\">黃色螢光<\u002Fbutton>\n                        <button sc-camel-on-click=\"{{ p.onHlB }}\" style=\"border:1px solid #d6d0
